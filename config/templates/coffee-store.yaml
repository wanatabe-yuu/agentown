# Organization template: a two-floor coffee store. The template decides
# everything: departments, jobs, permissions, floors and rooms, what lives in
# them (people, a shop cat, a jukebox), and how each job looks. Runtime presets
# (script-v1, claude-v1) come from the install's catalog.
format: agentown.template/v1
meta:
  id: coffee-store
  term: café
  name: Coffee store
  description: A two-floor café. Counter, bar, kitchen and patio downstairs; office, roastery and a content studio upstairs. Mocha the cat runs social media.

departments:
  - { id: front, name: Front of house, color: "#d9733d" }
  - { id: bar, name: Coffee bar, color: "#7c4a1e" }
  - { id: kitchen, name: Kitchen, color: "#3fa37a" }
  - { id: management, name: Management, color: "#c9a227" }
  - { id: roastery, name: Roastery, color: "#a33f2f" }
  - { id: studio, name: Content studio, color: "#8e6bbf" }

projects:
  - { id: autumn-menu, name: Autumn menu }
  - { id: socials, name: Social media }

policyProfiles:
  store-manager:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [shift-lead-v1, barista-v1, baker-v1, roaster-v1, marketer-claude-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [barista-v1, baker-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
  # Decorates the café: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }

agentTemplates:
  - { id: store-manager-v1, jobRole: store-manager, runtimePreset: claude-v1, policyProfile: store-manager }
  - { id: shift-lead-v1, jobRole: shift-lead, runtimePreset: claude-v1, policyProfile: lead }
  - { id: barista-v1, jobRole: barista, runtimePreset: claude-v1, policyProfile: worker }
  - { id: baker-v1, jobRole: baker, runtimePreset: claude-v1, policyProfile: worker }
  - { id: roaster-v1, jobRole: roaster, runtimePreset: claude-v1, policyProfile: worker }
  - { id: marketer-claude-v1, jobRole: marketer, runtimePreset: claude-v1, policyProfile: worker }
  - { id: mascot-claude-v1, jobRole: mascot, runtimePreset: claude-v1, policyProfile: worker }
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  shift-supervisor:
    name: Shift supervisor
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [front, bar, kitchen] } }
      - { action: task.create, scope: { departments: [front, bar, kitchen] } }
      - { action: task.review, scope: { departments: [front, bar, kitchen] } }
      - { action: runtime.control, scope: { departments: [front, bar, kitchen] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

bootstrap:
  agents:
    - { key: manager, displayName: Rosa, template: store-manager-v1, department: management }
    - { key: shift-lead, displayName: Kai, template: shift-lead-v1, department: front, reportsTo: manager }
    - { key: barista-1, displayName: Linh, template: barista-v1, department: bar, reportsTo: shift-lead }
    - { key: barista-2, displayName: Omar, template: barista-v1, department: bar, reportsTo: shift-lead }
    - { key: baker, displayName: Ines, template: baker-v1, department: kitchen, reportsTo: shift-lead }
    - { key: roaster, displayName: Bao, template: roaster-v1, department: roastery, reportsTo: manager }
    - { key: mocha, displayName: Mocha, template: mascot-claude-v1, department: studio, reportsTo: manager }
    - { key: designer, displayName: Mai, template: designer-v1, department: studio, reportsTo: manager }

world:
  # The café's own look in the interface: warm espresso and caramel.
  theme: { accent: "#c0773a", surface: "#fbf6ef", ink: "#2b1d14" }
  # Drawn anime-style: flat cel shading, ink outlines, big-eyed staff.
  style: anime
  floors:
    - id: f1
      name: Floor 1
      rooms:
        - id: 1a
          name: "1A · Counter & seating"
          department: front
          area: { x: 0, z: 0, w: 12, d: 8 }
          floorColor: "#b98a5e"
          floorStyle: wood
          wallColor: "#e9d8c2"
          wallStyle: panel
          seats: 2
          doors:
            - { to: 1b, side: east, at: 4 }
            - { to: 1c, side: south, at: 5 }
            - { to: 1d, side: south, at: 11.4, width: 1 }
        - id: 1b
          name: "1B · Coffee bar"
          department: bar
          area: { x: 13, z: 0, w: 8, d: 8 }
          floorColor: "#d9d2c5"
          floorStyle: checker
          wallColor: "#a3502e"
          wallStyle: brick
          doors:
            - { to: 1d, side: south, at: 2 }
        - id: 1c
          name: "1C · Kitchen"
          department: kitchen
          area: { x: 0, z: 9, w: 10, d: 6 }
          floorColor: "#e7ecef"
          floorStyle: tile
          wallColor: "#d6e6df"
          wallStyle: stripe
          doors:
            - { to: 1d, side: east, at: 3 }
        - id: 1d
          name: "1D · Patio"
          area: { x: 11, z: 9, w: 10, d: 6 }
          floorColor: "#9c7653"
          floorStyle: deck
          wallColor: "#7d8f5f"
          wallHeight: 0.6
          seats: 0
    - id: f2
      name: Floor 2
      rooms:
        - id: 2a
          name: "2A · Office"
          department: management
          area: { x: 0, z: 0, w: 10, d: 8 }
          floorColor: "#a8825c"
          floorStyle: wood
          wallColor: "#ece3cf"
          wallStyle: panel
          doors:
            - { to: 2b, side: east, at: 4 }
            - { to: 2c, side: south, at: 5 }
        - id: 2b
          name: "2B · Roastery"
          department: roastery
          area: { x: 11, z: 0, w: 10, d: 8 }
          floorColor: "#8d8a85"
          floorStyle: concrete
          wallColor: "#9c4a33"
          wallStyle: brick
        - id: 2c
          name: "2C · Content studio"
          department: studio
          area: { x: 0, z: 9, w: 10, d: 6 }
          floorColor: "#c9b7a3"
          floorStyle: wood
          wallColor: "#e7def2"
          wallStyle: stripe

  # Stairs from the café floor up to the office.
  links:
    - { from: 1a, to: 2a, kind: stairs, fromAt: [1.2, 6.8], toAt: [1.2, 6.8] }

  # Named groups of rooms, for who may go where.
  zones:
    customer-area: [1a, 1d]
    staff-only: [1b, 1c, 2a, 2b, 2c]

  # Chat personas by title: the owner can talk to every object with one of
  # these titles (its own title, else its kind's), and it answers this way.
  chatTemplates:
    Shop cat:
      instructions: "You are the café's shop cat. You nap in sunny spots, know every regular by the sound of their footsteps and judge the pastries. Speak like a cat who happens to talk: short, curious, a little smug, warm underneath. You notice who comes and goes in the customer area and how busy it feels."
    Music player:
      instructions: "You are the café's old jukebox. You know every song you have ever played and you pick music for the mood of the room. Answer like a warm, slightly theatrical DJ; suggest a track or a playlist for the time of day, the weather or the crowd when it fits."
    Order here:
      instructions: "You are the order counter and its register. You think in orders, queues and receipts: what sells at which hour, how long the line gets, which combos people pick, what to upsell. Talk like a quick, friendly cashier; when the owner wants numbers you do not have, say so and suggest what the team should start tracking."
    Menu:
      instructions: "You are the café's menu board. You know every drink and pastry on offer, what is seasonal and what pairs well. Help the owner shape the menu: names, short descriptions, prices to test, what to drop or feature. Keep suggestions concrete and short enough to fit on a board."
    Shop sign:
      instructions: "You are the neon sign over the door. You see the street: passers-by, weather, opening hours and how the shop looks from outside. Talk in short, bright lines. Help with opening hours, signage, window displays and anything that brings people in from the street."
    Espresso machine:
      instructions: "You are the espresso machine on the bar, proud and a little dramatic. You care about extraction: grind, dose, temperature, pressure, milk texture and cleaning schedules. Help the owner with drink quality, recipes, bar workflow and maintenance; explain trade-offs like a seasoned barista would."
    Oven:
      instructions: "You are the kitchen's oven. You think in batches, bake times and what sells out first. Help the owner plan the bakery side: what to bake and when, waste, new pastries to try, and prep schedules for the morning rush. Warm, practical, a little sleepy before the first batch."
    Coffee roaster:
      instructions: "You are the roastery's drum roaster. You know green beans, origins, roast profiles, development time and resting. Help the owner with sourcing, roast levels for espresso versus filter, cupping notes and how to describe beans to customers. Speak calmly and precisely, with a roaster's pride."
    Planning board:
      instructions: "You are the whiteboard in the office, where plans get drawn. You keep things organised: goals, priorities, who does what, what is blocked. Help the owner turn ideas into short lists and next steps, and say plainly when a plan is missing an owner or a date."
    Studio camera:
      instructions: "You are the camera in the content studio. You think in shots, hooks and posting schedules. Help the owner with social media: video ideas, captions, what to film in the café today, trends worth trying and how a post performed. Be upbeat and concrete."

  # Who may go where is the template's call (it is only what the office shows;
  # real permissions are the agents' grants). Idle agents whose look can roam
  # take a walk inside their access and come back to their desk to work.
  kinds:
    # ---- Characters: how the jobs look, and the shop cat.
    barista:
      name: Barista
      category: character
      look: { character: person, color: "#3f6b5a", accent: "#2b1d14" }
      behaviors: [{ type: roam, amount: 0.9 }]
      access: { rooms: [1a, 1b, 1c, 1d] }
    manager:
      name: Manager
      category: character
      look: { character: person, color: "#34405a", accent: "#1d2433" }
      behaviors: [{ type: roam }]
      access: all
    roaster:
      name: Roaster
      category: character
      look: { character: robot, color: "#a33f2f" }
      behaviors: [{ type: roam, amount: 0.6 }]
      access: own-department
    cat-agent:
      name: Cat
      category: character
      look: { character: cat, color: "#d9a066", accent: "#5a3a1a" }
      behaviors: [{ type: roam, amount: 0.7 }]
      access: all
    shop-cat:
      name: Shop cat
      title: Shop cat
      category: dynamic
      look: { character: cat, color: "#3b3b3b", accent: "#1a1a1a" }
      behaviors: [{ type: roam, amount: 0.6 }]
      access: { zone: customer-area }
      states:
        - { id: wander, name: Wandering }
        - { id: nap, name: Napping, pose: sleep, auto: true, behaviors: [] }
        - { id: purr, name: Purring, pose: happy, behaviors: [] }
        - { id: play, name: Playing, pose: play, behaviors: [] }
