# Agentown organization config (authored by the human owner).
# Agents cannot change this file through the API: templates and policy profiles
# below are the complete set of runtime shapes and permission bundles that can
# ever be instantiated. Contains no secrets.

organization:
  id: agentown
  name: Agentown

departments:
  - { id: exec, name: Executive, color: "#c9a227" }
  - { id: product, name: Product, color: "#8e6bbf" }
  - { id: eng, name: Engineering, color: "#3d8bd9" }
  - { id: ops, name: Operations, color: "#3fa37a" }

projects:
  - { id: website, name: Marketing website }

runtimeCatalog:
  # Deterministic adapter: runs the task's shell script. No model involved.
  - id: script-v1
    image: agentown/harness:0.4.0
    imagePullPolicy: Never
    harness: script
    workspace: { size: 256Mi }
    resources: { cpu: 250m, memory: 256Mi }
  # LLM harness. Each agent picks an API credential (added by the owner in the
  # UI) and a model that key can use; the credential's provider picks the
  # adapter: Anthropic Messages API, or OpenAI-compatible Chat Completions
  # (OpenAI, DeepSeek, Grok, Gemini, Mistral, Groq, OpenRouter, Together, custom).
  # `model` below is the default for Anthropic keys only.
  - id: claude-v1
    image: agentown/harness:0.4.0
    imagePullPolicy: Never
    harness: claude
    model: claude-opus-5-5
    workspace: { size: 512Mi }
    # Every agent runs this now; the harness mostly waits on the provider's API.
    resources: { cpu: 250m, memory: 256Mi }
  # Same runtime, but the agent gets a node of its own (see scripts/add-node.sh).
  - id: claude-dedicated-v1
    image: agentown/harness:0.4.0
    imagePullPolicy: Never
    harness: claude
    model: claude-opus-5-5
    placement: dedicated-node
    workspace: { size: 2Gi }
    resources: { cpu: "1", memory: 2Gi }

policyProfiles:
  ceo:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [leader-v1, po-v1, engineer-v1, qa-v1, engineer-claude-v1, engineer-claude-dedicated-v1] }
    # Can hand out (a subset of) team-scoped task rights to people in its tree.
    - { action: permission.delegate, scope: descendants }
    - { action: task.create, scope: descendants, delegable: true }
    # Deliberately no runtime.exec: exec must be granted to explicit targets.

  leader:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [engineer-v1, qa-v1, engineer-claude-v1, developer-v1, developer-claude-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: runtime.exec, scope: direct-reports }
    - { action: agent.configure, scope: direct-reports }

  po:
    - { action: org.view, scope: org }
    - { action: task.view, scope: { projects: [website] } }
    - { action: task.create, scope: { projects: [website] } }
    - { action: task.review, scope: { projects: [website] } }
    # No runtime.* and no spawn: managing the product does not mean a shell on engineers' machines.

  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }

  # A worker that may read the Agentown repository and propose changes to it.
  # Proposals become pull requests opened by the server; nobody's token reaches
  # the agent, and merging stays with humans (protect the default branch).
  developer:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    - { action: code.read, scope: self, repos: [agentown] }
    - { action: code.propose, scope: self, repos: [agentown] }

agentTemplates:
  - { id: ceo-v1, jobRole: ceo, runtimePreset: claude-v1, policyProfile: ceo }
  - { id: leader-v1, jobRole: leader, runtimePreset: claude-v1, policyProfile: leader }
  - { id: po-v1, jobRole: po, runtimePreset: claude-v1, policyProfile: po }
  - { id: engineer-v1, jobRole: engineer, runtimePreset: claude-v1, policyProfile: worker }
  - { id: qa-v1, jobRole: qa, runtimePreset: claude-v1, policyProfile: worker }
  - { id: engineer-claude-v1, jobRole: engineer, runtimePreset: claude-v1, policyProfile: worker }
  - { id: developer-v1, jobRole: engineer, runtimePreset: claude-v1, policyProfile: developer }
  - { id: developer-claude-v1, jobRole: engineer, runtimePreset: claude-v1, policyProfile: developer }
  - { id: engineer-claude-dedicated-v1, jobRole: engineer, runtimePreset: claude-dedicated-v1, policyProfile: worker }

# Permission presets for people (the owner adds them in the UI → Users).
# A role is only a starting point: picking it copies these permissions onto the
# person, and the owner can then add or remove permissions one by one.
# Scopes for people: org, {departments: [...]}, {agents: [...]}, {projects: [...]}.
humanRoles:
  admin:
    name: Admin
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }
      - { action: task.create, scope: org }
      - { action: task.assign, scope: org }
      - { action: task.review, scope: org }
      - { action: agent.spawn, scope: org, templates: [leader-v1, po-v1, engineer-v1, qa-v1, engineer-claude-v1, developer-v1, developer-claude-v1, engineer-claude-dedicated-v1] }
      - { action: agent.update, scope: org }
      - { action: agent.retire, scope: org }
      - { action: agent.configure, scope: org }
      - { action: runtime.control, scope: org }
      - { action: runtime.logs, scope: org }
      - { action: runtime.exec, scope: org }
      - { action: credential.manage, scope: org }
      - { action: audit.view, scope: org }
  eng-manager:
    name: Engineering manager
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [eng] } }
      - { action: task.create, scope: { departments: [eng] } }
      - { action: task.assign, scope: { departments: [eng] } }
      - { action: task.review, scope: { departments: [eng] } }
      - { action: agent.spawn, scope: { departments: [eng] }, templates: [engineer-v1, qa-v1, engineer-claude-v1, developer-v1, developer-claude-v1] }
      - { action: agent.configure, scope: { departments: [eng] } }
      - { action: runtime.control, scope: { departments: [eng] } }
      - { action: runtime.logs, scope: { departments: [eng] } }
      - { action: runtime.exec, scope: { departments: [eng] } }
  reviewer:
    name: Reviewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }
      - { action: task.review, scope: org }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

bootstrap:
  agents:
    - { key: ceo, displayName: Ava, template: ceo-v1, department: exec }
    - { key: po, displayName: Pham, template: po-v1, department: product, reportsTo: ceo }
    - { key: lead-eng, displayName: Linh, template: leader-v1, department: eng, reportsTo: ceo }
    - { key: lead-ops, displayName: Omar, template: leader-v1, department: ops, reportsTo: ceo }
