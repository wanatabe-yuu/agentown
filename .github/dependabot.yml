version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/harness
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /cli
    schedule: { interval: weekly }
