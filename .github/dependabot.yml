version: 2
# cooldown: only propose releases that are at least two weeks old, so a
# compromised or broken release has time to be noticed before it lands here.
# Node majors (runtime image and @types/node) are upgraded by hand, together
# with CI, the installers and the agent image; Dependabot still keeps the
# pinned node:24-alpine digest current.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /apps/harness
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /cli
    schedule: { interval: weekly }
    cooldown:
      default-days: 14
