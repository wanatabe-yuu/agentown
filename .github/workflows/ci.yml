name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentown
          POSTGRES_PASSWORD: agentown
          POSTGRES_DB: agentown_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentown"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://agentown:agentown@127.0.0.1:5432/agentown_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm check
      - name: Build web UI
        run: pnpm build:web
      - name: Bundle harness
        run: pnpm build:harness
      - name: Bundle server
        run: pnpm --filter @agentown/server build
      - name: Render cluster manifests
        run: npx tsx apps/server/src/tools/render-manifests.ts > /dev/null
      - name: Lint shell scripts
        run: shellcheck -S warning deploy/install.sh deploy/install-cli.sh deploy/uninstall.sh deploy/agentownctl scripts/*.sh deploy/gcp/*.sh

  cli:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build all platforms
        working-directory: .
        run: scripts/build-cli.sh dev dist-cli

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build release assets (dry run)
        run: scripts/package-release.sh "v$(node -p 'require("./package.json").version')" dist-release
