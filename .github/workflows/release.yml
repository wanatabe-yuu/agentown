name: Release

# Publishes a release for the version in package.json, either by
#   - "Run workflow" on main (Actions -> Release): creates the tag v<version>, or
#   - pushing a tag v<version>.
# Assets: agentown-<tag>.tar.gz, agentown-harness-<tag>-amd64.tar.gz, install.sh,
#   agentownctl_<os>_<arch> binaries with install-cli.sh, an SBOM,
#   SHA256SUMS signed keylessly with Sigstore (verified by deploy/install.sh),
#   and GitHub build-provenance attestations for every asset.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # A manual run only releases from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # Sigstore keyless signing and attestations
      attestations: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentown
          POSTGRES_PASSWORD: agentown
          POSTGRES_DB: agentown_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentown"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://agentown:agentown@127.0.0.1:5432/agentown_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p 'require("./package.json").version')"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists; bump the version in package.json first"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in release builds: a poisoned cache must not reach a signed artifact.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm check

      - name: Build release assets
        run: scripts/package-release.sh "$TAG" dist-release

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Test and build agentownctl
        run: |
          (cd cli && go vet ./... && go test ./...)
          scripts/build-cli.sh "$TAG" dist-release

      - name: SBOM (CycloneDX, from the lockfile)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist-release/agentown-${{ steps.tag.outputs.tag }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist-release
        run: |
          cp ../deploy/install.sh install.sh
          cp ../deploy/install-cli.sh install-cli.sh
          sha256sum agentown-* agentownctl_* install.sh install-cli.sh > SHA256SUMS && cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (Sigstore keyless)
        working-directory: dist-release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify the signature exactly as deploy/install.sh does
        working-directory: dist-release
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "(?i)^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/(tags/v|heads/main$)" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/agentown-*
            dist-release/agentownctl_*
            dist-release/install.sh
            dist-release/install-cli.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a manual run this also creates the tag, at the commit that was built.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes \
            --title "Agentown $TAG" dist-release/*
