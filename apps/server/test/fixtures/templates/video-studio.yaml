# Organization template: a two-floor video production house. Built from the
# coffee store: same permission shape, and its studio camera, ring light,
# backdrop, sofa, plants and lamps, plus a sound stage, edit suite and booth.
# Runtime presets (script-v1, claude-v1) come from the install's catalog.
format: agentown.template/v1
meta:
  id: video-studio
  term: studio
  name: Video studio
  description: A two-floor video production house. Sound stage, lobby, edit suite and sound booth downstairs; producer's office, writers' room and publishing desk upstairs. Pixel the studio dog runs the channel.

departments:
  - { id: management, name: Management, color: "#c9a227" }
  - { id: pre-production, name: Pre-production, color: "#3d8bd9" }
  - { id: production, name: Production, color: "#e5484d" }
  - { id: post-production, name: Post-production, color: "#8e6bbf" }
  - { id: publishing, name: Publishing, color: "#3fa37a" }

projects:
  - { id: brand-film, name: Brand film }
  - { id: weekly-show, name: Weekly show }

policyProfiles:
  studio-head:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [director-v1, scriptwriter-v1, camera-operator-v1, editor-v1, sound-engineer-v1, channel-manager-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [camera-operator-v1, editor-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
  # Dresses the sets: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }

agentTemplates:
  - { id: executive-producer-v1, jobRole: executive-producer, runtimePreset: claude-v1, policyProfile: studio-head }
  - { id: director-v1, jobRole: director, runtimePreset: claude-v1, policyProfile: lead }
  - { id: scriptwriter-v1, jobRole: scriptwriter, runtimePreset: claude-v1, policyProfile: worker }
  - { id: camera-operator-v1, jobRole: camera-operator, runtimePreset: claude-v1, policyProfile: worker }
  - { id: editor-v1, jobRole: editor, runtimePreset: claude-v1, policyProfile: worker }
  - { id: sound-engineer-v1, jobRole: sound-engineer, runtimePreset: claude-v1, policyProfile: worker }
  - { id: channel-manager-v1, jobRole: channel-manager, runtimePreset: claude-v1, policyProfile: worker }
  - { id: mascot-claude-v1, jobRole: mascot, runtimePreset: claude-v1, policyProfile: worker }
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  floor-manager:
    name: Floor manager
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [production, post-production] } }
      - { action: task.create, scope: { departments: [production, post-production] } }
      - { action: task.review, scope: { departments: [production, post-production] } }
      - { action: runtime.control, scope: { departments: [production, post-production] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

bootstrap:
  agents:
    - { key: producer, displayName: Vy, template: executive-producer-v1, department: management }
    - { key: director, displayName: Minh, template: director-v1, department: production, reportsTo: producer }
    - { key: writer, displayName: Lena, template: scriptwriter-v1, department: pre-production, reportsTo: producer }
    - { key: camera, displayName: Duc, template: camera-operator-v1, department: production, reportsTo: director }
    - { key: designer, displayName: Mai, template: designer-v1, department: production, reportsTo: director }
    - { key: editor, displayName: Sara, template: editor-v1, department: post-production, reportsTo: director }
    - { key: sound, displayName: Tom, template: sound-engineer-v1, department: post-production, reportsTo: director }
    - { key: channel, displayName: An, template: channel-manager-v1, department: publishing, reportsTo: producer }
    - { key: pixel, displayName: Pixel, template: mascot-claude-v1, department: publishing, reportsTo: producer }

